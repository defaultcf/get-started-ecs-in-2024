name: Validate Tofu
on:
  push:
    paths:
      - '**.tofu'
      - .github/workflows/validate-tofu.yaml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: v1.12.6
      - run: tofu init
      - run: tofu validate
